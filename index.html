<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Dreamzz Spa Admin</title>


  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }


    body {

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #f5efe6;

      color: #3d3028;

    }


    /* =========================
       MAIN CONTAINER
    ========================= */

    .container {

      width: 100%;

      max-width: 900px;

      margin: 0 auto;

      padding: 45px 20px;

      text-align: center;

    }


    /* =========================
       PAGE TITLE
    ========================= */

    .page-title {

      margin-bottom: 28px;

    }


    .page-title h1 {

      margin: 0;

      font-family: Georgia, serif;

      font-size: 32px;

      font-weight: 600;

      color: #3d3028;

    }


    .page-title p {

      margin: 7px 0 0;

      color: #8a7564;

      font-size: 14px;

    }


    /* =========================
       LOGIN CARD
    ========================= */

    .card {

      width: 100%;

      max-width: 620px;

      margin: 0 auto;

      padding: 32px 30px;

      background: #fffdf9;

      border: 1px solid #eadfd2;

      border-radius: 16px;

      box-shadow:
        0 10px 30px
        rgba(61, 48, 40, 0.08);

    }


    .card h2 {

      margin: 0 0 22px;

      font-family: Georgia, serif;

      font-size: 22px;

      font-weight: 600;

      color: #3d3028;

    }


    /* =========================
       PASSWORD INPUT
    ========================= */

    input {

      width: 100%;

      height: 46px;

      padding: 0 15px;

      border: 1px solid #d9c9b8;

      border-radius: 9px;

      background: #fffdf9;

      color: #3d3028;

      font-size: 14px;

      outline: none;

      text-align: center;

    }


    input::placeholder {

      color: #9a8878;

    }


    input:focus {

      border-color: #b58b52;

      box-shadow:
        0 0 0 3px
        rgba(181, 139, 82, 0.10);

    }


    /* =========================
       LOGIN BUTTON
    ========================= */

    button {

      display: block;

      margin: 14px auto 0;

      padding: 11px 24px;

      border: none;

      border-radius: 9px;

      background: #5b4636;

      color: white;

      font-size: 14px;

      font-weight: 600;

      cursor: pointer;

    }


    button:hover {

      background: #49372b;

    }


    /* =========================
       ADMIN SECTION
    ========================= */

    .hidden {

      display: none;

    }


    #adminSection {

      margin-top: 20px;

    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      .container {

        padding: 35px 14px;

      }


      .page-title h1 {

        font-size: 27px;

      }


      .card {

        padding: 26px 18px;

      }

    }

  </style>

</head>


<body>


  <div class="container">


    <!-- PAGE TITLE -->

    <div class="page-title">

      <h1>
        Dreamzz Spa Admin
      </h1>

      <p>
        Booking Management
      </p>

    </div>


    <!-- LOGIN -->

    <div
      id="loginSection"
      class="card"
    >

      <h2>
        Admin Login
      </h2>


      <input
        id="password"
        type="password"
        placeholder="Enter admin password"
        autocomplete="off"
      >


      <button
        onclick="login()"
      >
        Login
      </button>

    </div>


    <!-- ADMIN -->

    <div
      id="adminSection"
      class="card hidden"
    >

      <h2>
        Welcome to Admin Panel
      </h2>


      <button
        onclick="loadBookings()"
      >
        🔄 Refresh
      </button>


      <button
        onclick="exportBookings()"
      >
        ⬇ Export
      </button>

    </div>


  </div>


  <script>


    /* =========================
       BACKEND URL
    ========================= */

    const BOOKING_URL =
      "https://script.google.com/macros/s/AKfycbxsK1yZF70Y9dG-EgyEsKlzu3j1lqrIYfBpfDlygM0wy_NNkPPotvyCMNYAfxIwb9g/exec";


    /* =========================
       LOGIN
    ========================= */

    async function login() {


      const password =
        document
          .getElementById("password")
          .value
          .trim();


      if (!password) {

        alert(
          "Please enter admin password."
        );

        return;

      }


      try {


        const response =
          await fetch(
            BOOKING_URL,
            {

              method: "POST",

              headers: {
                "Content-Type":
                  "text/plain;charset=utf-8"
              },

              body: JSON.stringify({

                action: "adminLogin",

                password: password

              })

            }
          );


        const data =
          await response.json();


        if (data.success) {


          document
            .getElementById(
              "loginSection"
            )
            .classList
            .add("hidden");


          document
            .getElementById(
              "adminSection"
            )
            .classList
            .remove("hidden");


        } else {


          alert(
            "Wrong password."
          );

        }


      } catch (error) {


        console.error(error);


        alert(
          "Login connection error."
        );

      }

    }


    /* =========================
       REFRESH
    ========================= */

    function loadBookings() {

      alert(
        "Bookings refresh function is ready."
      );

    }


    /* =========================
       EXPORT
    ========================= */

    function exportBookings() {

      alert(
        "Export function is ready."
      );

    }


    /* =========================
       ENTER KEY LOGIN
    ========================= */

    document
      .getElementById("password")
      .addEventListener(
        "keydown",
        function(event) {

          if (
            event.key === "Enter"
          ) {

            event.preventDefault();

            login();

          }

        }
      );


  </script>


</body>
</html>
