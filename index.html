<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dreamzz Spa - AI Receptionist</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f3ede4;
      color: #3d3028;
    }

    .app {
      width: 100%;
      max-width: 500px;
      height: 100vh;
      height: 100dvh;
      margin: auto;
      background: #fffdf9;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(61, 48, 40, 0.08);
    }

    /* HEADER */

    .header {
      padding: 18px;
      background: #4a382d;
      color: white;
      border-bottom: 3px solid #b58b52;
    }

    .header h2 {
      margin: 0;
      font-family: Georgia, serif;
      font-size: 22px;
      font-weight: 600;
    }

    .header p {
      margin: 5px 0 0;
      color: #dfd3c6;
      font-size: 13px;
    }

    /* CHAT */

    #chat {
      flex: 1;
      padding: 16px 15px;
      overflow-y: auto;
      background: #faf7f2;
    }

    #chat::-webkit-scrollbar {
      width: 5px;
    }

    #chat::-webkit-scrollbar-thumb {
      background: #d8c8b7;
      border-radius: 10px;
    }

    /* MESSAGE */

    .message {
      padding: 11px 14px;
      margin: 8px 0;
      border-radius: 14px;
      max-width: 84%;
      line-height: 1.45;
      white-space: pre-wrap;
      word-wrap: break-word;
      font-size: 14px;
    }

    .bot {
      background: #eee7de;
      color: #40342c;
      border-bottom-left-radius: 5px;
    }

    .user {
      background: #5a4435;
      color: white;
      margin-left: auto;
      border-bottom-right-radius: 5px;
    }

    /* INPUT AREA */

    .input-area {
      display: flex;
      align-items: center;
      padding: 8px 9px;
      border-top: 1px solid #e4d9cd;
      gap: 7px;
      background: #fffdf9;
    }

    input {
      flex: 1;
      min-width: 0;
      height: 43px;
      padding: 0 13px;
      border: 1px solid #d9c9b8;
      border-radius: 10px;
      outline: none;
      background: #faf7f2;
      color: #3d3028;
      font-size: 14px;
    }

    input::placeholder {
      color: #9d8d7e;
    }

    input:focus {
      border-color: #b58b52;
      background: #fffdf9;
    }

    /* SEND BUTTON */

    #sendButton {
      height: 43px;
      padding: 0 16px;
      border: none;
      border-radius: 10px;
      background: #5a4435;
      color: white;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }

    #sendButton:hover {
      background: #463328;
    }

    #sendButton:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }


    /* VOICE BUTTON */

    .voice-btn {
      width: 43px;
      height: 43px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #b58b52;
      color: white;
      border: none;
      border-radius: 50%;
      font-size: 19px;
      cursor: pointer;
    }

    .voice-btn:hover {
      background: #9f773f;
    }

    .voice-btn.listening {
      background: #8b3f32;
      animation: voicePulse 1s infinite;
    }

    @keyframes voicePulse {
      50% {
        transform: scale(1.08);
      }
    }

    /* WHATSAPP */

    .whatsapp-btn {
      width: 43px;
      height: 43px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #25d366;
      color: white;
      text-decoration: none;
      border-radius: 50%;
      font-size: 21px;
    }

    .whatsapp-btn:hover {
      opacity: 0.9;
    }

    /* CALL BUTTON */

    .call-btn {
      height: 43px;
      padding: 0 13px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      background: #eee6dc;
      color: #5a4435;
      border: 1px solid #d9c9b8;
      text-decoration: none;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }

    .call-btn:hover {
      background: #e4d7c8;
    }

    /* MOBILE */

    @media (max-width: 520px) {

      .app {
        max-width: none;
        box-shadow: none;
      }

      .header {
        padding: 17px 16px;
      }

      #chat {
        padding: 14px 13px;
      }

      .message {
        max-width: 88%;
      }

      .input-area {
        padding: 7px 8px;
        gap: 6px;
      }

      input {
        height: 42px;
        padding: 0 11px;
      }

      #sendButton {
        height: 42px;
        padding: 0 14px;
      }

      .voice-btn {
        width: 42px;
        height: 42px;
      }

      .whatsapp-btn {
        width: 42px;
        height: 42px;
      }

      .call-btn {
        height: 42px;
        padding: 0 11px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <div class="header">
    <h2>Dreamzz Spa</h2>
    <p>Online • Kajal</p>
  </div>


  <div id="chat">

    <div class="message bot">
Hi 👋 Welcome to Dreamzz Spa.

Main aapko services, prices aur appointment ke baare mein help kar sakta hoon.
    </div>

  </div>


  <div class="input-area">

    <input
      id="messageInput"
      type="text"
      placeholder="Type your message..."
      autocomplete="off"
    >

    <button
      id="sendButton"
      onclick="sendMessage()"
    >
      Send
    </button>

    <button
      id="voiceButton"
      class="voice-btn"
      type="button"
      onclick="toggleVoice()"
      title="Voice"
      aria-label="Voice"
    >🎤</button>

    <a
      class="whatsapp-btn"
      href="https://wa.me/917011030144?text=Hello%20Dreamzz%20Spa%2C%20mujhe%20booking%20karni%20hai."
      target="_blank"
      title="WhatsApp Booking"
    >
      💬
    </a>

    <a
      class="call-btn"
      href="tel:+917011030144"
    >
      📞 Call
    </a>

  </div>

</div>


<script>

  /* ==================================================
     GOOGLE APPS SCRIPT BACKEND
  ================================================== */

  const BOOKING_URL =
    "https://script.google.com/macros/s/AKfycbxsK1yZF70Y9dG-EgyEsKlzu3j1lqrIYfBpfDlygM0wy_NNkPPotvyCMNYAfxIwb9g/exec";


  /* ==================================================
     CONVERSATION HISTORY
  ================================================== */

  let conversationHistory = [];


  /* ==================================================
     VOICE AGENT
  ================================================== */

  let recognition = null;
  let isListening = false;

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = "hi-IN";
    recognition.continuous = false;
    recognition.interimResults = false;

    recognition.onstart = function() {
      isListening = true;

      const voiceButton =
        document.getElementById("voiceButton");

      voiceButton.classList.add("listening");
      voiceButton.textContent = "⏹";
      voiceButton.title = "Stop listening";
    };

    recognition.onresult = function(event) {
      const transcript =
        event.results[0][0].transcript.trim();

      const input =
        document.getElementById("messageInput");

      input.value = transcript;

      sendMessage();
    };

    recognition.onerror = function(event) {
      console.error("Voice error:", event.error);
      stopVoice();
    };

    recognition.onend = function() {
      stopVoice();
    };
  }

  function toggleVoice() {
    if (!recognition) {
      alert(
        "Voice feature is not supported in this browser. Please use Google Chrome."
      );
      return;
    }

    if (isListening) {
      recognition.stop();
    } else {
      try {
        recognition.start();
      } catch (error) {
        console.error("Voice start error:", error);
      }
    }
  }

  function stopVoice() {
    isListening = false;

    const voiceButton =
      document.getElementById("voiceButton");

    if (voiceButton) {
      voiceButton.classList.remove("listening");
      voiceButton.textContent = "🎤";
      voiceButton.title = "Voice";
    }
  }

  function speakReply(text) {
    if (!("speechSynthesis" in window)) {
      return;
    }

    window.speechSynthesis.cancel();

    const cleanText = text
      .replace(/https?:\/\/\S+/g, "")
      .replace(/[📞💬✅❌😊👋]/g, "")
      .trim();

    if (!cleanText) {
      return;
    }

    const utterance =
      new SpeechSynthesisUtterance(cleanText);

    utterance.lang = "hi-IN";
    utterance.rate = 0.95;
    utterance.pitch = 1;

    window.speechSynthesis.speak(utterance);
  }


  /* ==================================================
     BOOKING SAVED CHECK
  ================================================== */

  let bookingSaved = false;


  /* ==================================================
     SAVE BOOKING TO GOOGLE SHEET
  ================================================== */

  async function saveBookingToSheet(booking) {

    try {

      await fetch(BOOKING_URL, {

        method: "POST",

        mode: "no-cors",

        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },

        body: JSON.stringify({

          name: booking.name,

          phone: booking.phone,

          service: booking.service,

          date: booking.date,

          time: booking.time,

          status: "New"

        })

      });

      bookingSaved = true;

      return true;

    } catch (error) {

      console.error(
        "Booking save error:",
        error
      );

      return false;
    }
  }


  /* ==================================================
     EXTRACT BOOKING
  ================================================== */

  function extractBooking(reply) {

    const start =
      reply.indexOf("BOOKING_DATA_START");

    const end =
      reply.indexOf("BOOKING_DATA_END");


    if (
      start === -1 ||
      end === -1
    ) {

      return {
        cleanReply: reply,
        booking: null
      };

    }


    try {

      const jsonText =
        reply
          .substring(
            start + "BOOKING_DATA_START".length,
            end
          )
          .trim();


      const booking =
        JSON.parse(jsonText);


      const cleanReply =
        reply.replace(
          /BOOKING_DATA_START[\s\S]*?BOOKING_DATA_END/,
          ""
        ).trim();


      return {
        cleanReply: cleanReply,
        booking: booking
      };


    } catch (error) {

      console.error(
        "Booking JSON error:",
        error
      );


      return {
        cleanReply: reply,
        booking: null
      };

    }
  }


  /* ==================================================
     SEND MESSAGE
  ================================================== */

  async function sendMessage() {

    const input =
      document.getElementById(
        "messageInput"
      );

    const chat =
      document.getElementById(
        "chat"
      );

    const button =
      document.getElementById(
        "sendButton"
      );


    const message =
      input.value.trim();


    if (!message) {
      return;
    }


    /* USER MESSAGE */

    const userMessage =
      document.createElement("div");

    userMessage.className =
      "message user";

    userMessage.textContent =
      message;

    chat.appendChild(
      userMessage
    );


    input.value = "";

    button.disabled = true;

    button.textContent = "...";


    /* AI MESSAGE */

    const botMessage =
      document.createElement("div");

    botMessage.className =
      "message bot";

    botMessage.textContent =
      "Thinking...";

    chat.appendChild(
      botMessage
    );


    chat.scrollTop =
      chat.scrollHeight;


    /* HISTORY */

    conversationHistory.push({

      role: "user",

      parts: [
        {
          text: message
        }
      ]

    });


    try {

      /* GEMINI BACKEND */

      const response =
        await fetch(
          BOOKING_URL,
          {

            method: "POST",

            headers: {
              "Content-Type":
                "text/plain;charset=utf-8"
            },

            body: JSON.stringify({

              action: "gemini",

              message: message,

              history:
                conversationHistory.map(
                  item => ({

                    role: item.role,

                    text:
                      item.parts?.[0]?.text || ""

                  })
                )

            })

          }
        );


      const data =
        await response.json();


      if (!data.success) {

        throw new Error(
          data.error ||
          "Gemini API request failed"
        );

      }


      /* AI RESPONSE */

      const rawReply =
        data.reply ||
        "Sorry, mujhe response nahi mila.";


      /* BOOKING DATA */

      const result =
        extractBooking(
          rawReply
        );


      const reply =
        result.cleanReply;


      /* SHOW RESPONSE */

      botMessage.textContent =
        reply;

      speakReply(reply);


      /* HISTORY */

      conversationHistory.push({

        role: "model",

        parts: [

          {
            text: rawReply
          }

        ]

      });


      /* SAVE BOOKING */

      if (
        result.booking &&
        !bookingSaved
      ) {

        const saved =
          await saveBookingToSheet(
            result.booking
          );


        if (saved) {

          botMessage.textContent =
            reply +
            "\n\n✅ Thank you! Aapki booking request receive ho gayi hai. Hum jald hi aapse contact karenge. 😊";

          speakReply(botMessage.textContent);

        }

      }


    } catch (error) {

      console.error(
        "AI Error:",
        error
      );


      botMessage.textContent =
        "❌ AI se connection nahi ho paya.\n\n" +
        "Please try again.";


      conversationHistory.pop();

    }


    /* ENABLE */

    button.disabled = false;

    button.textContent =
      "Send";


    chat.scrollTop =
      chat.scrollHeight;


    input.focus();

  }


  /* ==================================================
     ENTER KEY
  ================================================== */

  document
    .getElementById(
      "messageInput"
    )
    .addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Enter"
        ) {

          event.preventDefault();

          sendMessage();

        }

      }
    );

</script>

</body>
</html>
