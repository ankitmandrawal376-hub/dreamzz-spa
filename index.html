<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dreamzz Spa Admin</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5efe6;
      color: #3d3028;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: auto;
      padding: 28px 20px;
    }

    .page-title {
      margin-bottom: 20px;
    }

    .page-title h1 {
      margin: 0;
      font-family: Georgia, serif;
      font-size: 30px;
      color: #3d3028;
    }

    .page-title p {
      margin: 5px 0 0;
      color: #8a7564;
      font-size: 14px;
    }

    .card {
      background: #fffdf9;
      border: 1px solid #eadfd2;
      border-radius: 16px;
      padding: 22px;
      box-shadow: 0 8px 25px rgba(61, 48, 40, 0.08);
    }

    .card h2 {
      margin-top: 0;
      color: #3d3028;
      font-family: Georgia, serif;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d9c9b8;
      border-radius: 9px;
      background: #fffdf9;
      color: #3d3028;
      font-size: 14px;
      outline: none;
    }

    input:focus {
      border-color: #b58b52;
    }

    button {
      border: none;
      border-radius: 9px;
      padding: 11px 18px;
      background: #5b4636;
      color: white;
      font-size: 14px;
      cursor: pointer;
      font-weight: 600;
    }

    button:hover {
      background: #49372b;
    }

    .login-button {
      margin-top: 10px;
    }

    .gold-button {
      background: #b58b52;
    }

    .gold-button:hover {
      background: #9d753f;
    }

    .login-box {
      max-width: 620px;
      margin: 0 auto;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 600px) {

      .container {
        padding: 20px 12px;
      }

      .page-title h1 {
        font-size: 26px;
      }

      .card {
        padding: 18px;
      }

    }

  </style>
</head>

<body>

  <div class="container">

    <div class="page-title">
      <h1>Dreamzz Spa Admin</h1>
      <p>Booking Management</p>
    </div>


    <!-- LOGIN -->

    <div id="loginSection" class="card login-box">

      <h2>Admin Login</h2>

      <input
        id="password"
        type="password"
        placeholder="Enter admin password"
        autocomplete="off"
      >

      <button
        class="login-button"
        onclick="login()"
      >
        Login
      </button>

    </div>


    <!-- ADMIN -->

    <div
      id="adminSection"
      class="card hidden"
    >

      <h2>Bookings</h2>

      <p>
        Admin panel is ready.
      </p>

      <button onclick="loadBookings()">
        🔄 Refresh
      </button>

      <button
        class="gold-button"
        onclick="exportBookings()"
      >
        ⬇ Export
      </button>

    </div>

  </div>


<script>

const BOOKING_URL =
"https://script.google.com/macros/s/AKfycbxsK1yZF70Y9dG-EgyEsKlzu3j1lqrIYfBpfDlygM0wy_NNkPPotvyCMNYAfxIwb9g/exec";


function login(){

  const password =
    document.getElementById("password").value.trim();

  if(!password){

    alert("Please enter admin password.");

    return;

  }


  fetch(
    BOOKING_URL,
    {
      method:"POST",

      headers:{
        "Content-Type":
          "text/plain;charset=utf-8"
      },

      body:JSON.stringify({

        action:"adminLogin",

        password:password

      })

    }
  )
  .then(response => response.json())

  .then(data => {

    if(data.success){

      document
        .getElementById("loginSection")
        .classList.add("hidden");

      document
        .getElementById("adminSection")
        .classList.remove("hidden");

    }else{

      alert("Wrong password.");

    }

  })
  .catch(error => {

    console.error(error);

    alert("Login connection error.");

  });

}


function loadBookings(){

  console.log("Refresh clicked.");

}


function exportBookings(){

  console.log("Export clicked.");

}


document
  .getElementById("password")
  .addEventListener(
    "keydown",
    function(event){

      if(event.key === "Enter"){

        login();

      }

    }
  );

</script>

</body>
</html>
